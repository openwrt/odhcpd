name: odhcpd

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  sdk:
    name: SDK
    uses: openwrt/actions-shared-workflows/.github/workflows/sdk-package-build.yml@main
    with:
      package: odhcpd
      packages: odhcpd odhcpd-ipv6only

  native:
    name: Build native ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: basic
            options: ""
          - variant: DHCPv4
            options: -DDHCPV4_SUPPORT=ON
          - variant: UBUS
            options: -DUBUS=ON
          - variant: full
            options: -DDHCPV4_SUPPORT=ON -DUBUS=ON
    steps:
      - name: Checkout odhcpd
        uses: actions/checkout@v5

      - name: Checkout json-c
        uses: actions/checkout@v5
        with:
          repository: json-c/json-c
          path: depends/json-c

      - name: Checkout libnl-tiny
        uses: actions/checkout@v5
        with:
          repository: openwrt/libnl-tiny
          path: depends/libnl-tiny

      - name: Checkout libubox
        uses: actions/checkout@v5
        with:
          repository: openwrt/libubox
          path: depends/libubox

      - name: Checkout ubus
        uses: actions/checkout@v5
        with:
          repository: openwrt/ubus
          path: depends/ubus

      - name: Checkout uci
        uses: actions/checkout@v5
        with:
          repository: openwrt/uci
          path: depends/uci

      - name: Prepare build
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/build

      - name: Build json-c
        working-directory: depends/json-c
        run: |
          cmake \
            -DCMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/build \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_STATIC_LIBS=OFF \
            -DDISABLE_EXTRA_LIBS=ON \
            -DBUILD_TESTING=OFF \
            --install-prefix ${GITHUB_WORKSPACE}/build \
            -B . -S .
          make
          make install

      - name: Build libnl-tiny
        working-directory: depends/libnl-tiny
        run: |
          cmake \
            -DCMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/build \
            --install-prefix ${GITHUB_WORKSPACE}/build \
            -B . -S .
          make
          make install

      - name: Build libubox
        working-directory: depends/libubox
        run: |
          cmake \
            -DCMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/build \
            -DBUILD_LUA=OFF \
            -DBUILD_EXAMPLES=OFF \
            --install-prefix ${GITHUB_WORKSPACE}/build \
            -B . -S .
          make
          make install

      - name: Build ubus
        working-directory: depends/ubus
        run: |
          cmake \
            -DCMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/build \
            -DBUILD_LUA=OFF \
            -DBUILD_STATIC=OFF \
            -DBUILD_EXAMPLES=OFF \
            --install-prefix ${GITHUB_WORKSPACE}/build \
            -B . -S .
          make
          make install

      - name: Build uci
        working-directory: depends/uci
        run: |
          cmake \
            -DCMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/build \
            -DBUILD_LUA=OFF \
            -DBUILD_STATIC=OFF \
            --install-prefix ${GITHUB_WORKSPACE}/build \
            -B . -S .
          make
          make install

      - name: Build odhcpd
        env:
          BUILD_DIR: build/odhcpd-${{ matrix.variant }}
        run: |
          cmake \
            -DCMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/build \
            ${{ matrix.options }} \
            -B $BUILD_DIR -S .
          make -C $BUILD_DIR
          {
            echo "| variant | size |"
            echo "| :--- | ---: |"
            echo "| ${{ matrix.variant }} | $( stat -c %s $BUILD_DIR/odhcpd ) |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: odhcpd-native-${{ matrix.variant }}
          path: build/odhcpd-${{ matrix.variant }}/odhcpd
          if-no-files-found: error
